# Server port
server.port=8080

# OpenAI API config - Set OPENAI_API_KEY as an environment variable
# If missing, it defaults to a dummy value to avoid startup crashes
openai.api.key=${OPENAI_API_KEY:REPLACE_WITH_YOUR_KEY}
openai.api.model=${OPENAI_API_MODEL:google/gemini-2.0-flash-001}

# Logging
logging.level.com.fluento.backend=DEBUG

# Spring Boot versioning/info (if needed)
spring.application.name=fluento-backend

# -----------------------------
# DYNAMIC DATABASE CONFIG (Universal Auto-Detection)
# -----------------------------
# Simply set SUPABASE_DB_URL/PASSWORD in prod.
# If missing, it defaults to local H2 automatically!
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:fluentodb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SUPABASE_DB_USERNAME:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}

# Spring Boot will auto-detect the Driver and Dialect based on the URL!
# (No need to force org.h2.Driver anymore)

# Common Settings
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.jpa.show-sql=false
