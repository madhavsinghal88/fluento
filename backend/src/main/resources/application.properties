# Server port
server.port=8080

# OpenAI API config - usually set via env vars in production
openai.api.key=${OPENAI_API_KEY}
openai.api.model=${OPENAI_API_MODEL:gpt-4o}

# Logging
logging.level.com.fluento.backend=DEBUG

# Spring Boot versioning/info (if needed)
spring.application.name=fluento-backend

# -----------------------------
# SUPABASE POSTGRESQL CONFIG
# -----------------------------
spring.datasource.url=jdbc:postgresql://db.fksnlldnniscghdpbvzy.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatically create/update database tables
spring.jpa.hibernate.ddl-auto=update

# Optional: Show SQL logs to help debugging
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
