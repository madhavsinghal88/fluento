# Server port
server.port=8080

# OpenAI API config - MUST be set via env vars in production
openai.api.key=${OPENAI_API_KEY}
openai.api.model=${OPENAI_API_MODEL:google/gemini-2.0-flash-001}

# Logging
logging.level.com.fluento.backend=DEBUG

# Spring Boot versioning/info (if needed)
spring.application.name=fluento-backend

# -----------------------------
# SUPABASE POSTGRESQL CONFIG
# -----------------------------
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.fksnlldnniscghdpbvzy.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Create/Update database tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
